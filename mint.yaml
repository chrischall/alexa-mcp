version: 1
name: Amazon Alexa
slug: alexa
summary: >-
  Echo devices, announcements, routines, smart-home control, shopping/to-do
  lists and alarms through Amazon's Alexa web API. Each user signs in to Amazon
  in their own browser and pastes back the address they land on; every write
  is confirmation-gated.
identity:
  perUserChild: true
auth:
  flow:
    steps:
      - tool: alexa_begin_login
        carry: [loginId, signInUrl]
        title: Preparing your Amazon sign-in
        description: >-
          Creates a one-time amazon.com sign-in link for this connection. Nothing
          is sent to Amazon yet.
      - tool: alexa_finish_login
        args:
          loginId: { from: loginId }
          redirectUrl: { from: redirectUrl }
        # The sign-in link is minted per connection (PKCE), so it cannot be
        # written into the description: the gateway renders it as a button,
        # and only on the hosts listed here.
        link:
          from: signInUrl
          hosts: [www.amazon.com]
          label: Sign in to Amazon
        prompt:
          - name: redirectUrl
            label: Address of the page you landed on
            type: text
            help: >-
              After signing in, Amazon shows a blank www.amazon.com/ap/maplanding
              page. Copy its full address from the address bar and paste it here.
              The link works for 15 minutes and only once.
        title: Sign in to Amazon
        description: >-
          Open the sign-in link and sign in to Amazon as you normally would
          (password, two-step code, anything Amazon asks happens on amazon.com,
          never here). Then paste back the address of the page you land on. This
          adds an "alexa-mcp" device to your Amazon account; removing it there
          revokes the connection.
env:
  - name: ALEXA_AMAZON_PAGE
    required: false
    help: >-
      Amazon site the account lives on (default amazon.com, or whatever the
      registration recorded). Non-US sites also need their hosts added to egress.
  - name: ALEXA_ACCEPT_LANGUAGE
    required: false
    help: Accept-Language sent to Amazon (default en-US).
  - name: MCP_CONFIRM_MODE
    required: false
    help: >-
      ask-user (default) / auto / refuse — whether the model must get your
      approval in chat before using a write's confirmToken.
  - name: MCP_CONFIRM_ELICITATION
    required: false
    help: Set to off to skip the confirmation prompt even on clients that declare elicitation support.
state:
  dataDir: true
  reason: >-
    Keeps $HOME/.alexa-mcp/registration.json (0600): the registration as last
    refreshed. Amazon session cookies are re-minted from the refresh token every
    few days; without persistence every cold start goes back to the pasted
    seed and refreshes again, and once the seed's cookies age out every start
    pays a refresh before the first tool call.
egress:
  allow:
    # Alexa web API — the base host is resolved at runtime from
    # alexa.amazon.com's endpoint document (websiteApiUrl), which answered
    # na-api-alexa.amazon.com for a US account on 2026-10-07.
    - alexa.amazon.com
    - na-api-alexa.amazon.com
    # Device list / communications metadata fetched during init.
    - alexa-comms-mobile-service.amazon.com
    # Cookie refresh from the refresh token (alexa-cookie2) and the shopping
    # list item API (alexashoppinglists lives on www.<amazonPage>).
    - api.amazon.com
    - www.amazon.com
    # Alarms (alexa_create_reminder type Alarm, and cancelling one) go to the
    # "alexaApiUrl" from the same endpoint document — api.amazonalexa.com for a
    # US account — through alexa-remote2's httpsGetAuthApi.
    - api.amazonalexa.com
